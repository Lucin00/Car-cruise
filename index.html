<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Slow Drive — Endless Chill Driving</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="scene"></canvas>

  <div id="hud">
    <div id="hud-left">
      <div id="speed-panel">
        <span id="speed-value">0</span>
        <span id="speed-unit">km/h</span>
      </div>
      <div id="auto-badge">AUTO</div>
    </div>
    <div id="hud-right">
      <div id="time-toggle">
        <button data-time="day" class="active">Day</button>
        <button data-time="sunset">Sunset</button>
        <button data-time="night">Night</button>
      </div>
      <button id="menu-btn">Menu</button>
    </div>
  </div>

  <div id="overlay">
    <div id="overlay-inner">
      <h1>slow<span>drive</span></h1>
      <p class="tagline">An endless road. No missions, no traffic, no rush. Just you, the horizon, and the hum of the engine.</p>

      <div class="picker-section">
        <h2>Vehicle</h2>
        <div id="vehicle-picker" class="picker-grid"></div>
      </div>

      <div class="picker-section">
        <h2>Map</h2>
        <div id="map-picker" class="picker-grid"></div>
      </div>

      <button id="start-btn">Start Driving</button>
      <div class="controls-hint">
        <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> or Arrow Keys to drive</span>
        <span><kbd>F</kbd> snap back to the road</span>
        <span><kbd>R</kbd> toggle auto-drive</span>
        <span><kbd>Esc</kbd> to pause</span>
      </div>
    </div>
  </div>

  <div id="pause-hint">Press <kbd>Esc</kbd> to resume</div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>
  <script type="module" src="script.js"></script>
</body>
</html>
